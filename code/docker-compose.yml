# Environnement de développement
#   Lancer      : docker compose up --build
#   Ouvrir      : http://localhost:8080
#   Arrêter     : Ctrl+C, puis docker compose down
#   Tout effacer (y compris la base) : docker compose down -v

services:
  app:
    build: .
    ports:
      - "8080:8000"
    volumes:
      - ./app:/code/app          # le code local est monté : une modif = rechargement auto
      - donnees:/code/data       # base SQLite persistante
    environment:
      SNMP_TARGET: snmp-agent    # nom du service ci-dessous (résolu par le DNS de Docker)
      SNMP_COMMUNITY: public
      DB_PATH: /code/data/supervision.db
      WATCHFILES_FORCE_POLLING: "true"   # nécessaire pour détecter les modifs depuis Windows
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - snmp-agent
      - snmp-agent-routeur
      - snmp-agent-serveur
      - snmp-agent-switch-embarque
      - snmp-agent-ap-wifi

  # Faux équipements réseau : des agents SNMP v2c (Net-SNMP) pour tester sans matériel,
  # avec des identités différentes. Les deux derniers excluent volontairement
  # HOST-RESOURCES-MIB pour simuler un OS embarqué propriétaire (cf. leur snmpd.conf). Les
  # trois premiers (modèle générique) reçoivent un volume tmpfs monté sur /volume1 : la
  # racine d'un conteneur Docker est en overlayfs, un type de système de fichiers que
  # Net-SNMP ne détecte pas comme du stockage (contrairement à ext4/btrfs sur un vrai
  # serveur), donc sans ce montage le test de collecte du stockage n'aurait rien à lire.
  snmp-agent:
    build: ./agents-test/snmp-agent
    tmpfs:
      - /volume1:size=200m

  snmp-agent-routeur:
    build: ./agents-test/snmp-agent-routeur
    tmpfs:
      - /volume1:size=200m

  snmp-agent-serveur:
    build: ./agents-test/snmp-agent-serveur
    tmpfs:
      - /volume1:size=200m

  snmp-agent-switch-embarque:
    build: ./agents-test/snmp-agent-switch-embarque

  snmp-agent-ap-wifi:
    build: ./agents-test/snmp-agent-ap-wifi

volumes:
  donnees:

# Environnement de développement
#   Lancer      : docker compose up --build
#   Ouvrir      : http://localhost:8080
#   Arrêter     : Ctrl+C, puis docker compose down
#   Base SQLite : data/supervision.db (dossier local, conservé par docker compose down)
#   Repartir d'une base vide : arrêter, puis supprimer data/supervision.db

services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8000"    # accessible depuis ce poste uniquement (cf. spécifications, section 9)
    volumes:
      - ./app:/code/app          # le code local est monté : une modif = rechargement auto
      - ./data:/code/data       # base SQLite persistante
    environment:
      SNMP_TARGET: snmp-agent    # nom du service ci-dessous (résolu par le DNS de Docker)
      SNMP_COMMUNITY: public
      DB_PATH: /code/data/supervision.db
      # Valeurs de DÉVELOPPEMENT uniquement : à changer hors de vos postes
      SECRET_KEY: dev-cle-a-changer
      ADMIN_PASSWORD: admin
      LECTEUR_PASSWORD: lecteur
      WATCHFILES_FORCE_POLLING: "true"   # nécessaire pour détecter les modifs depuis Windows
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - snmp-agent

  # Faux équipement réseau : un agent SNMP v2c (Net-SNMP) pour tester sans matériel
  snmp-agent:
    build: ./snmp-agent

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}Supervision SNMP{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="entete">
    <h1>Super vision</h1>
    <nav class="navigation">
      <a href="/" class="{{ 'actif' if page_active == 'tableau_de_bord' }}">Tableau de bord</a>
      <a href="/inventaire" class="{{ 'actif' if page_active == 'inventaire' }}">Gestion de l'inventaire</a>
      <a href="/modeles" class="{{ 'actif' if page_active == 'modeles' }}">Modèles de supervision</a>
      <a href="/alertes" class="{{ 'actif' if page_active == 'alertes' }}">Alertes</a>
      <a href="/logs" class="{{ 'actif' if page_active == 'logs' }}">Logs</a>
    </nav>
    <span class="version">v0.7 · modèles de supervision personnalisés</span>
  </header>

  <main class="contenu{{ ' contenu-large' if page_active in ('fiche_equipement', 'tableau_de_bord', 'alertes', 'logs', 'modeles') }}">
    {% if erreur %}
      <p class="bandeau-erreur">{{ erreur }}</p>
    {% endif %}

    {% block contenu %}{% endblock %}
  </main>

  <script>
    // N'affiche, dans une légende de modèles de supervision, que la bulle d'aide du
    // modèle actuellement sélectionné dans le <select> associé (data-legende-modeles
    // référence l'id du conteneur de la légende).
    document.querySelectorAll("select[data-legende-modeles]").forEach(function (select) {
      var legende = document.getElementById(select.dataset.legendeModeles);
      if (!legende) return;
      function majAffichage() {
        legende.querySelectorAll(".info-bulle-modele").forEach(function (bulle) {
          bulle.style.display = bulle.dataset.modele === select.value ? "" : "none";
        });
      }
      select.addEventListener("change", majAffichage);
      majAffichage();
    });
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>

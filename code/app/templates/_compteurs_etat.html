{# Attend `bleu` (disponibles, facultatif), `orange` (avertissements) et `rouge` (critiques) : affichés en vert, jaune et rouge. Le texte d'aide évite de ne compter que sur la couleur. #}
<span class="compteurs-etat">
  {% if bleu is defined %}<span class="compteur-etat ok" title="Disponibles : {{ bleu }}" aria-label="Disponibles : {{ bleu }}">{{ bleu }}</span>{% endif %}
  <span class="compteur-etat degrade" title="Avertissement : {{ orange }}" aria-label="Avertissement : {{ orange }}">{{ orange }}</span>
  <span class="compteur-etat ko" title="Critique : {{ rouge }}" aria-label="Critique : {{ rouge }}">{{ rouge }}</span>
</span>

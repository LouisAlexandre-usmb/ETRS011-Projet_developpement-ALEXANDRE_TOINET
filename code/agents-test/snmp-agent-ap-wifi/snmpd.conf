# Configuration de l'agent SNMP de test
agentaddress  udp:161

# SNMP v2c, lecture seule, communauté "public" : accès restreint à une vue qui exclut
# HOST-RESOURCES-MIB (1.3.6.1.2.1.25), pour simuler un équipement réseau à OS embarqué
# propriétaire (comme le vrai switch Cisco du labo, qui ne supporte pas cette MIB).
rocommunity   public  default  -V restreinte
view restreinte included .1
view restreinte excluded .1.3.6.1.2.1.25

# Informations renvoyées par le groupe "system" (MIB-II)
sysDescr      Point d'accès WiFi AP-TEST-01 - ETRS011 Lab Equipment
sysName       ap-test-01
sysLocation   Labo ETRS011 - baie virtuelle Docker
sysContact    Louis ALEXANDRE & Mattis TOINET
sysServices   72

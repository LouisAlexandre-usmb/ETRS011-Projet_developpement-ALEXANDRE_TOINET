# Configuration de l'agent SNMP de test
agentaddress  udp:161

# SNMP v2c, lecture seule, communauté "public", accès à toute l'arborescence
rocommunity   public  default

# Informations renvoyées par le groupe "system" (MIB-II)
sysDescr      Switch virtuel SW-TEST-01 - ETRS011 Lab Equipment
sysName       sw-test-01
sysLocation   Labo ETRS011 - baie virtuelle Docker
sysContact    Louis ALEXANDRE & Mattis TOINET
sysServices   72

# Faux capteurs d'environnement (température, ventilateurs, consommation...) pour la démo
# des modèles de supervision personnalisés : snmpd délègue cette branche au script.
pass .1.3.6.1.4.1.8072.9999 /bin/sh /usr/local/bin/capteurs.sh
